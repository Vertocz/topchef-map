<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<link  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>

<style>
  /* ── Design tokens ── */
  :root {
    --ink:     #1a1208;
    --cream:   #faf7f2;
    --gold:    #c8922a;
    --gold-lt: #e8c06a;
    --rouge:   #c0392b;
    --vert:    #2e7d52;
    --bleu:    #2c5f8a;
    --panel-w: 340px;
    --radius:  10px;
    --font-display: 'Georgia', serif;
    --font-body: system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--ink);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--ink);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    border-bottom: 2px solid var(--gold);
    z-index: 1000;
  }
  header h1 {
    font-family: var(--font-display);
    font-size: 1.15rem;
    color: var(--gold);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  header h1 span { color: var(--cream); font-size: 0.75rem; font-style: italic; margin-left: 8px; }

  .header-stats {
    display: flex;
    gap: 14px;
    margin-left: auto;
    font-size: 0.72rem;
    color: #aaa;
  }
  .header-stats strong { color: var(--gold-lt); }

  /* ── Layout principal ── */
  .app {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Panneau latéral ── */
  .sidebar {
    width: var(--panel-w);
    background: var(--cream);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    border-right: 1px solid #ddd;
  }

  .filters {
    padding: 14px 16px;
    background: #fff;
    border-bottom: 1px solid #e0d8cc;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .filters-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    font-weight: 600;
  }

  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    padding: 8px 32px 8px 12px;
    border: 1px solid #ccc;
    border-radius: var(--radius);
    font-size: 0.85rem;
    background: var(--cream);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-wrap .clear-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: #aaa; font-size: 1rem;
    display: none;
  }
  .search-wrap input:not(:placeholder-shown) + .clear-btn { display: block; }

  .filter-row { display: flex; gap: 8px; }

  select {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid #ccc;
    border-radius: var(--radius);
    font-size: 0.82rem;
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--gold); }

  .btn-reset {
    padding: 7px 12px;
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    background: transparent;
    color: var(--gold);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-reset:hover { background: var(--gold); color: #fff; }

  /* ── Liste des chefs ── */
  .results-header {
    padding: 10px 16px 6px;
    font-size: 0.72rem;
    color: #999;
    background: var(--cream);
    border-bottom: 1px solid #e0d8cc;
  }
  .results-header strong { color: var(--ink); }

  .chef-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px;
  }
  .chef-list::-webkit-scrollbar { width: 4px; }
  .chef-list::-webkit-scrollbar-track { background: transparent; }
  .chef-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

  .chef-card {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    border-left: 3px solid transparent;
    margin-bottom: 2px;
  }
  .chef-card:hover { background: #f0ebe2; }
  .chef-card.active { background: #fdf3e0; border-left-color: var(--gold); }

  .chef-card .chef-name {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .chef-card .chef-meta {
    font-size: 0.74rem;
    color: #777;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .badge-vainqueur  { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
  .badge-finaliste  { background: #e8f4f8; color: #0c5460; border: 1px solid #bee5eb; }
  .badge-elimine    { background: #f8f9fa; color: #6c757d; border: 1px solid #dee2e6; }
  .badge-troisieme  { background: #fce8e8; color: #721c24; border: 1px solid #f5c6cb; }

  /* ── Carte ── */
  #map {
    flex: 1;
    z-index: 1;
  }

  /* ── Popup Leaflet ── */
  .leaflet-popup-content-wrapper {
    border-radius: var(--radius) !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18) !important;
    padding: 0 !important;
    overflow: hidden;
    min-width: 220px;
  }
  .leaflet-popup-content { margin: 0 !important; }
  .leaflet-popup-tip-container { display: none; }

  .popup-inner { padding: 16px; font-family: var(--font-body); }
  .popup-season {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .popup-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    font-family: var(--font-display);
    margin-bottom: 2px;
  }
  .popup-etab {
    font-size: 0.78rem;
    color: #555;
    font-style: italic;
    margin-bottom: 8px;
  }
  .popup-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: #777;
    margin-top: 6px;
  }
  .popup-ville { display: flex; align-items: center; gap: 4px; }
  .popup-ville::before { content: "📍"; font-size: 0.7rem; }
  .popup-actuel {
    margin-top: 8px;
    padding: 7px 10px;
    background: #f5f0e8;
    border-radius: 6px;
    border-left: 3px solid var(--gold);
    font-size: 0.78rem;
    color: var(--ink);
  }
  .popup-actuel-label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .popup-actuel-nom { font-weight: 600; }
  .popup-maj {
    font-size: 0.65rem;
    color: #aaa;
    text-align: right;
    margin-top: 8px;
    font-style: italic;
  }

  /* Marqueurs custom */
  .marker-pin {
    width: 28px; height: 28px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .marker-pin.vainqueur  { background: var(--gold); }
  .marker-pin.finaliste  { background: var(--bleu); }
  .marker-pin.elimine    { background: #888; }
  .marker-pin.troisieme  { background: var(--rouge); }

  /* ── Légende ── */
  .legend {
    position: absolute;
    bottom: 24px;
    right: 16px;
    z-index: 500;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(6px);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 0.72rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    border: 1px solid #e0d8cc;
  }
  .legend-title { font-weight: 700; margin-bottom: 8px; color: var(--ink); }
  .legend-item  { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: #444; }
  .legend-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .header-stats { display: none; }
  }
</style>
</head>

// ── Helpers ───────────────────────────────────────────────────────────────
function categorie(r) {
  const s = (r || '').toLowerCase();
  if (s.includes('vainqueur') || s.includes('gagnante')) return 'vainqueur';
  if (s.includes('finaliste')) return 'finaliste';
  if (s.includes('troisième') || s.includes('troisieme')) return 'troisieme';
  return 'elimine';
}
function badgeHtml(r) {
  const c = categorie(r);
  const labels = { vainqueur:'🏆 Vainqueur', finaliste:'🥈 Finaliste', troisieme:'🥉 Troisième', elimine:'Éliminé(e)' };
  return `<span class="badge badge-${c}">${labels[c]}</span>`;
}
function markerColor(r) {
  const c = categorie(r);
  return { vainqueur:'#c8922a', finaliste:'#2c5f8a', troisieme:'#c0392b', elimine:'#888' }[c];
}

// ── Carte Leaflet ─────────────────────────────────────────────────────────
const map = L.map('map', { center: [46.5, 5], zoom: 5, zoomControl: true });

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a> · © <a href="https://carto.com/">CartoDB</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 40,
  iconCreateFunction: c => L.divIcon({
    html: `<div style="background:var(--gold);color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)">${c.getChildCount()}</div>`,
    className: '', iconSize: [36, 36]
  })
});
map.addLayer(cluster);

// Marqueur custom (épingle colorée)
function makeIcon(chef) {
  const color = markerColor(chef.resultat);
  return L.divIcon({
    html: `<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>`,
    className: '', iconSize: [22, 22], iconAnchor: [11, 22], popupAnchor: [0, -24]
  });
}

// Popup
// Mois courts en français (indépendant de la locale système)
const MOIS_COURT = ['jan.’','fév.','mar.','avr.','mai','juin','juil.','août','sep.','oct.','nov.','éc.'];

function formatMaj(isoDate) {
  if (!isoDate) return null;
  const d = new Date(isoDate);
  return MOIS_COURT[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

function makePopup(chef) {
  const elim = chef.date_elimination
    ? `<div class="popup-row"><span>Éliminé(e) le</span><span>${new Date(chef.date_elimination).toLocaleDateString('fr-FR')}</span></div>`
    : '';

  let actuelHtml = '';
  if (chef.etablissement_actuel) {
    const ville   = chef.ville_actuelle ? ` · ${chef.ville_actuelle}` : '';
    const majStr  = formatMaj(chef._enrichissement_date);
    const majHtml = majStr ? `<div class="popup-maj">Actualisé en ${majStr}</div>` : '';
    actuelHtml = `<div class="popup-actuel"><div class="popup-actuel-label">Aujourd'hui</div><div class="popup-actuel-nom">${chef.etablissement_actuel}${ville}</div></div>${majHtml}`;
  }

  return `<div class="popup-inner">
      <div class="popup-season">Saison ${chef.saison}</div>
      <div class="popup-name">${chef.nom}</div>
      <div class="popup-etab">À l'époque : ${chef.etablissement}</div>
      ${badgeHtml(chef.resultat)}
      <div class="popup-row"><span class="popup-ville">${chef.ville}</span><span>${chef.age} ans</span></div>
      ${elim}${actuelHtml}
    </div>`;
}

function makePopup(chef) {
  const elim = chef.date_elimination
    ? '<div class="popup-row"><span>Éliminé(e) le</span><span>' + new Date(chef.date_elimination).toLocaleDateString('fr-FR') + '</span></div>'
    : '';

  let actuelHtml = '';
  if (chef.etablissement_actuel) {
    const ville   = chef.ville_actuelle ? ' · ' + chef.ville_actuelle : '';
    const majStr  = formatMaj(chef._enrichissement_date);
    const majHtml = majStr ? '<div class="popup-maj">Actualisé en ' + majStr + '</div>' : '';
    actuelHtml = '<div class="popup-actuel"><div class="popup-actuel-label">Aujourd\'hui</div><div class="popup-actuel-nom">' + chef.etablissement_actuel + ville + '</div></div>' + majHtml;
  }

  return '<div class="popup-inner">'
    + '<div class="popup-season">Saison ' + chef.saison + '</div>'
    + '<div class="popup-name">' + chef.nom + '</div>'
    + '<div class="popup-etab">À l\'époque : ' + chef.etablissement + '</div>'
    + badgeHtml(chef.resultat)
    + '<div class="popup-row"><span class="popup-ville">' + chef.ville + '</span><span>' + chef.age + ' ans</span></div>'
    + elim
    + actuelHtml
    + '</div>';
}

// ── État & Filtres ────────────────────────────────────────────────────────
let activeIndex = null;
const markers = [];

// Peupler les selects
const saisons = [...new Set(CHEFS.map(c => c.saison))].sort((a,b)=>a-b);
const villesUniq = [...new Set(CHEFS.map(c => c.ville))].sort();
const selSaison = document.getElementById('sel-saison');
const selVille  = document.getElementById('sel-ville');
saisons.forEach(s => { selSaison.innerHTML += `<option value="${s}">Saison ${s}</option>`; });
villesUniq.forEach(v => { selVille.innerHTML += `<option value="${v}">${v}</option>`; });

// Stat villes
document.getElementById('stat-villes').textContent = villesUniq.length;

// Création des marqueurs une seule fois
CHEFS.forEach((chef, idx) => {
  const marker = L.marker([chef.lat, chef.lon], { icon: makeIcon(chef) });
  marker.bindPopup(makePopup(chef), { maxWidth: 260, closeButton: true });
  marker.on('click', () => highlightCard(idx));
  markers.push(marker);
  cluster.addLayer(marker);
});

// ── Filtrage ──────────────────────────────────────────────────────────────
function getFilters() {
  return {
    q:       document.getElementById('search').value.toLowerCase().trim(),
    saison:  selSaison.value,
    resultat:document.getElementById('sel-resultat').value,
    ville:   selVille.value,
  };
}

function applyFilters() {
  const f = getFilters();
  cluster.clearLayers();
  const list = document.getElementById('chef-list');
  list.innerHTML = '';
  let count = 0;

  CHEFS.forEach((chef, idx) => {
    const cat = categorie(chef.resultat);
    const pass =
      (!f.q       || chef.nom.toLowerCase().includes(f.q) || chef.ville.toLowerCase().includes(f.q) || chef.etablissement.toLowerCase().includes(f.q)) &&
      (!f.saison  || chef.saison == f.saison) &&
      (!f.resultat|| cat === f.resultat) &&
      (!f.ville   || chef.ville === f.ville);

    if (pass) {
      cluster.addLayer(markers[idx]);
      count++;
      const card = document.createElement('div');
      card.className = 'chef-card' + (activeIndex === idx ? ' active' : '');
      card.dataset.idx = idx;
      card.innerHTML = `
        <div class="chef-name">${chef.nom}</div>
        <div class="chef-meta">
          ${badgeHtml(chef.resultat)}
          <span>S${chef.saison}</span>
          <span>${chef.ville}</span>
        </div>`;
      card.addEventListener('click', () => {
        activeIndex = idx;
        map.setView([chef.lat, chef.lon], 10, { animate: true });
        markers[idx].openPopup();
        document.querySelectorAll('.chef-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      });
      list.appendChild(card);
    }
  });

  document.getElementById('result-count').textContent = count;
}

function highlightCard(idx) {
  activeIndex = idx;
  document.querySelectorAll('.chef-card').forEach(c => c.classList.remove('active'));
  const card = document.querySelector(`.chef-card[data-idx="${idx}"]`);
  if (card) { card.classList.add('active'); card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

function resetFilters() {
  document.getElementById('search').value = '';
  selSaison.value = '';
  selVille.value = '';
  document.getElementById('sel-resultat').value = '';
  activeIndex = null;
  applyFilters();
}

function clearSearch() {
  document.getElementById('search').value = '';
  applyFilters();
}

// Événements
['search','sel-saison','sel-resultat','sel-ville'].forEach(id =>
  document.getElementById(id).addEventListener('input', applyFilters)
);

// Initialisation
applyFilters();
</script>
